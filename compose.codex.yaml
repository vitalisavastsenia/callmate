# Opt-in local mock dialogue using a saved ChatGPT subscription login.
# docker compose -f compose.yaml -f compose.codex.yaml --profile web up --build -d
services:
  server:
    build:
      target: runtime-codex
    environment:
      CALLMATE_DIALOGUE_PROVIDER: codex
      CALLMATE_DIALOGUE_TIMEOUT_MS: "60000"
      CODEX_HOME: /codex
      OPENAI_API_KEY: ""
    volumes:
      - callmate-codex:/codex
  web:
    environment:
      VITE_MOCK: "false"
volumes:
  callmate-codex:
